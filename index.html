<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Walk</title>
<meta name="theme-color" content="#003A70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Site Walk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ============================================================
     PASTE YOUR APPS SCRIPT LINK (ends with /exec) IN APP_URL BELOW
     ============================================================ */
  html, body { margin: 0; height: 100%; background: #003A70; overflow: hidden; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  #app { position: fixed; inset: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); border: 0; background: #F2F5F9; }
  #splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; background: #FFFFFF; color: #0B2A5B; font: 600 16px/1.4 "Segoe UI", system-ui, sans-serif; text-align: center; padding: 24px; z-index: 2; transition: opacity .3s; }
  #splash img { width: 220px; height: 220px; }
  #splash .bar { width: 140px; height: 4px; border-radius: 4px; background: #E6ECF3; overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: #C8A87A; border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
  #splash small { color: #5A6A80; font-weight: 400; max-width: 34ch; }
  #splash.gone { opacity: 0; pointer-events: none; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } }
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <img src="logo-full.png" alt="Imdaad Soft Services">
  <div>Site Walk</div>
  <div class="bar"><i></i></div>
  <small id="msg">Loading…</small>
</div>
<iframe id="app" title="Site Walk" allow="camera; clipboard-write; fullscreen"></iframe>
<script>
  // >>>>>>>>>> PASTE YOUR LINK HERE (keep the quotes) <<<<<<<<<<
  var APP_URL = "https://script.google.com/macros/s/AKfycbxMC1S-q8fnEquV7soezSLI9BrKI5ygXY1Ix-dLlaGvvuCoX-odjVwZQ1dbgroZo80W/exec";

  var splash = document.getElementById("splash"), msg = document.getElementById("msg"), frame = document.getElementById("app");
  function hide() { splash.classList.add("gone"); }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(APP_URL)) {
    msg.textContent = "Setup needed: open index.html and paste the Apps Script link (ending with /exec) in APP_URL.";
    document.querySelector("#splash .bar").style.display = "none";
  } else if (!navigator.onLine) {
    msg.textContent = "No internet connection. Connect and open the app again.";
    document.querySelector("#splash .bar").style.display = "none";
    window.addEventListener("online", function () { location.reload(); });
  } else {
    frame.addEventListener("load", function () { setTimeout(hide, 600); });
    setTimeout(function () { if (!splash.classList.contains("gone")) msg.textContent = "Still loading. Check your connection…"; }, 12000);
    frame.src = APP_URL;
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
